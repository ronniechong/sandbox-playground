name: PR staleness status

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  status:
    # A same-repo-only signal: GitHub only grants a write-scoped token to
    # `pull_request` runs when the PR's head branch lives in this repo, so
    # a forked PR silently gets a read-only token and this job's comment
    # step no-ops rather than needing its own fork check.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3.0.0
      - run: pnpm install --frozen-lockfile

      # Read-only against the currently deployed site — never checks out
      # or writes to site-state, never builds or deploys anything. "Current"
      # values are read at this PR's head commit (ADDENDUM-004 §1's HEAD
      # rule generalizes to "the ref under test", not literally main here).
      - name: Checkout site-state
        continue-on-error: true
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: site-state
          path: site

      - name: Run pnpm status
        id: status
        run: |
          set -euo pipefail
          just status --registry site/registry.json --site-dir site \
            --ref "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/status.md"
          cat "$RUNNER_TEMP/status.md"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          BODY_FILE="$RUNNER_TEMP/status.md"
          # `--edit-last` only matches a comment already authored by this
          # token's identity, so pushing new commits to the same PR updates
          # one comment instead of piling up a new one per push.
          if ! gh pr comment "$PR" -R "${{ github.repository }}" --edit-last --body-file "$BODY_FILE" 2>/dev/null; then
            gh pr comment "$PR" -R "${{ github.repository }}" --body-file "$BODY_FILE"
          fi
