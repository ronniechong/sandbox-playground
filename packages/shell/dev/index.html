<!doctype html>
<!--
  Temporary local harness for M05's own manual leak-check/navigation
  testing only. Superseded once M07's registry builder + dev server
  exist. Not part of the deployed site.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>shell dev harness</title>
  </head>
  <body>
    <div id="controls">
      <button data-nav="hello-world">hello-world</button>
      <button data-nav="fake-app">fake-app</button>
      <button data-nav="disabled-app">disabled-app (expect 404)</button>
      <button data-nav="unknown-app">unknown-app (expect 404)</button>
      <button id="cycle">cycle hello-world/fake-app x10</button>
      <button id="overlap">fire 2 rapid navigations</button>
      <span id="status"></span>
    </div>
    <hr />
    <div id="app"></div>

    <script type="module">
      const basePath = '/packages/shell/dev';

      window.__sandboxPlaygroundConfig = {
        basePath,
        registryUrl: `${basePath}/registry.json`,
        theme: 'light',
      };

      if (!window.location.pathname.startsWith(`${basePath}/apps/`)) {
        window.history.replaceState(null, '', `${basePath}/apps/hello-world`);
      }

      const { parseLocation } = await import('../src/router.ts');

      document.querySelectorAll('[data-nav]').forEach((btn) => {
        btn.addEventListener('click', () => {
          window.history.pushState(null, '', `${basePath}/apps/${btn.dataset.nav}`);
          window.dispatchEvent(new PopStateEvent('popstate'));
        });
      });

      document.getElementById('cycle').addEventListener('click', async () => {
        const status = document.getElementById('status');
        for (let i = 0; i < 10; i++) {
          for (const slug of ['hello-world', 'fake-app']) {
            window.history.pushState(null, '', `${basePath}/apps/${slug}`);
            window.dispatchEvent(new PopStateEvent('popstate'));
            await new Promise((r) => setTimeout(r, 60));
          }
        }
        status.textContent = `cycled 10x — nodes: ${document.querySelectorAll('*').length}`;
      });

      document.getElementById('overlap').addEventListener('click', () => {
        window.history.pushState(null, '', `${basePath}/apps/hello-world`);
        window.dispatchEvent(new PopStateEvent('popstate'));
        window.history.pushState(null, '', `${basePath}/apps/fake-app`);
        window.dispatchEvent(new PopStateEvent('popstate'));
      });

      void parseLocation; // imported only to prove module resolution works pre-boot

      await import('../src/index.ts');
    </script>
  </body>
</html>
